name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check adapter syntax
        run: node --check adapter.js
      - name: Check shell scripts
        run: |
          for f in *.sh; do
            bash -n "$f"
          done
